openapi: 3.1.0
info:
  title: SanpoGuide チャンネル管理システム 管理 API
  version: 1.0.0
  summary: チャンネル提供者と運営が SPA から使う API（yorisoi-console API-001）
  description: |
    [console-api.md](../console-api.md)（API-001）を機械で読める形にしたもの。
    方針・状態・権限の根拠は契約書が正本で、食い違いがあれば契約書に合わせてこのファイルを直す。

    - 利用者は同じリポジトリの SPA だけ。SPA と同じ CloudFront の `/api/*` で提供する
    - 認証は Cognito のアクセストークン。`/api/admin/*` は `operator` のグループだけ
    - 状態が変わるものは `ETag`（`rev`）を返し、変える操作は `If-Match` が必須
    - 日時は UTC の ISO 8601、バイナリは base64url（パディングなし）
    - 知らない項目は無視する（`additionalProperties` は許可）
servers:
  - url: '{baseUrl}'
    description: SPA と同じオリジン
    variables:
      baseUrl:
        default: https://console.example.com
security:
  - cognito: []
tags:
  - name: me
    description: ログインしているユーザー
  - name: publisher
    description: チャンネル提供者（登録・鍵・移し替え・退会）
  - name: channels
    description: チャンネルと申請
  - name: collections
    description: 素材集と申請（素材提供者。1.1）
  - name: review
    description: 審査（運営）
  - name: admin-publishers
    description: チャンネル提供者の管理（運営）
  - name: keys
    description: 署名鍵・鍵セット（運営）
  - name: publications
    description: 公開と操作の記録（運営）
  - name: studio
    description: スタジオ（提供者。DES-013）
  - name: admin-studio
    description: スタジオの提供者の承認と申し出（運営。DES-013）
  - name: admin-notes
    description: 一言の運営の操作（通報された一言・締め出し）
  - name: admin-local
    description: 区画ごとに運営から取る素材（スタジオ・一言）の置けない区画

paths:
  /api/me:
    get:
      tags: [me]
      operationId: getMe
      summary: ログインしているユーザー・役割・チャンネル提供者
      responses:
        '200':
          description: ユーザー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher:
    post:
      tags: [publisher]
      operationId: registerPublisher
      summary: チャンネル提供者として登録（pending_key）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublisherInput' }
      responses:
        '201': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }
    get:
      tags: [publisher]
      operationId: getMyPublisher
      summary: 自分のチャンネル提供者
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [publisher]
      operationId: updateMyPublisher
      summary: 表示名・連絡先の変更
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublisherPatch' }
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [publisher]
      operationId: deleteMyPublisher
      summary: 退会（公開中のチャンネルはすべて取り下げる）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: 自分の publisherId（打ち間違い防止） }
      responses:
        '204': { description: 退会した }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher/keys/challenge:
    post:
      tags: [publisher]
      operationId: createKeyChallenge
      summary: 鍵の紐づけ用の一度きりの文字列（10 分）
      responses:
        '201':
          description: 一度きりの文字列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyChallenge' }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher/keys:
    get:
      tags: [publisher]
      operationId: listMyKeys
      summary: 鍵の一覧（今のものと過去のもの）
      responses:
        '200':
          description: 鍵
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PublisherKey' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [publisher]
      operationId: bindFirstKey
      summary: 最初の鍵を紐づける
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyProof' }
      responses:
        '201':
          description: 紐づけた鍵
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublisherKey' }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher/key-transfers:
    get:
      tags: [publisher]
      operationId: listMyKeyTransfers
      summary: 移し替えの申し出の一覧
      responses:
        '200':
          description: 申し出
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KeyTransfer' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [publisher]
      operationId: requestKeyTransfer
      summary: 新しい鍵を紐づけて移し替えを申し出る
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KeyTransferInput' }
      responses:
        '201': { $ref: '#/components/responses/KeyTransfer' }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher/key-transfers/{transferId}/cancel:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [publisher]
      operationId: cancelKeyTransfer
      summary: 移し替えの申し出を取り消す
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/KeyTransfer' }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher/history:
    get:
      tags: [publisher]
      operationId: listMyHistory
      summary: 自分のチャンネル提供者・チャンネルの経緯
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/AuditPage' }
        default: { $ref: '#/components/responses/Error' }

  /api/channels:
    get:
      tags: [channels]
      operationId: listMyChannels
      summary: 自分のチャンネルの一覧
      responses:
        '200': { $ref: '#/components/responses/ChannelList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [channels]
      operationId: registerChannel
      summary: チャンネル ID を登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channelId]
              properties:
                channelId: { $ref: '#/components/schemas/ChannelId' }
      responses:
        '201': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }

  /api/channels/{channelId}:
    parameters: [{ $ref: '#/components/parameters/ChannelId' }]
    get:
      tags: [channels]
      operationId: getChannel
      summary: チャンネル（チャンネル提供者は自分のもの、運営はすべて）
      responses:
        '200': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }

  /api/channels/{channelId}/submissions:
    parameters: [{ $ref: '#/components/parameters/ChannelId' }]
    get:
      tags: [channels]
      operationId: listSubmissions
      summary: 申請の一覧（新しい順）
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 申請
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Submission' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [channels]
      operationId: createSubmission
      summary: 申請を作り、アップロード先を受け取る
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmissionInput' }
      responses:
        '201':
          description: 申請とアップロード先
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubmissionCreated' }
        default: { $ref: '#/components/responses/Error' }

  /api/channels/{channelId}/submissions/{submissionId}:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [channels]
      operationId: getSubmission
      summary: 申請（機械審査の結果、判定と理由）
      responses:
        '200': { $ref: '#/components/responses/Submission' }
        default: { $ref: '#/components/responses/Error' }

  /api/channels/{channelId}/submissions/{submissionId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [channels]
      operationId: withdrawSubmission
      summary: 申請を取り消す（awaiting_review・in_review のとき）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/Submission' }
        default: { $ref: '#/components/responses/Error' }

  /api/channels/{channelId}/submissions/{submissionId}/test-tickets:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [channels]
      operationId: listTestTickets
      summary: 試用チケットの一覧
      responses:
        '200':
          description: 試用チケット
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TestTicket' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [channels]
      operationId: issueTestTicket
      summary: 試用チケットを発行（7 日）
      responses:
        '201':
          description: 試用チケット
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestTicket' }
        default: { $ref: '#/components/responses/Error' }

  /api/publisher/roles/producer:
    post:
      tags: [publisher]
      operationId: enableProducerRole
      summary: 素材提供者の役割を有効にする（C-15）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }

  /api/collections:
    get:
      tags: [collections]
      operationId: listMyCollections
      summary: 自分の素材集の一覧
      responses:
        '200': { $ref: '#/components/responses/CollectionList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [collections]
      operationId: registerCollection
      summary: 素材集 ID を登録
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collectionId]
              properties:
                collectionId: { $ref: '#/components/schemas/CollectionId' }
      responses:
        '201': { $ref: '#/components/responses/Collection' }
        default: { $ref: '#/components/responses/Error' }

  /api/collections/{collectionId}:
    parameters: [{ $ref: '#/components/parameters/CollectionId' }]
    get:
      tags: [collections]
      operationId: getCollection
      summary: 素材集（素材提供者は自分のもの、運営はすべて）
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        default: { $ref: '#/components/responses/Error' }

  /api/collections/{collectionId}/used-by:
    parameters: [{ $ref: '#/components/parameters/CollectionId' }]
    get:
      tags: [collections]
      operationId: listCollectionUsers
      summary: 素材集を使っているチャンネル（利用の記録、C-18）
      responses:
        '200':
          description: 使っているチャンネル
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UsedBy' } }
        default: { $ref: '#/components/responses/Error' }

  /api/collections/{collectionId}/submissions:
    parameters: [{ $ref: '#/components/parameters/CollectionId' }]
    get:
      tags: [collections]
      operationId: listCollectionSubmissions
      summary: 申請の一覧（新しい順）
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 申請
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CollectionSubmission' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [collections]
      operationId: createCollectionSubmission
      summary: 申請を作り、アップロード先を受け取る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000, description: 運営への説明 }
      responses:
        '201':
          description: 申請とアップロード先
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionSubmissionCreated' }
        default: { $ref: '#/components/responses/Error' }

  /api/collections/{collectionId}/submissions/{submissionId}:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [collections]
      operationId: getCollectionSubmission
      summary: 申請（機械審査の結果、判定と理由）
      responses:
        '200': { $ref: '#/components/responses/CollectionSubmission' }
        default: { $ref: '#/components/responses/Error' }

  /api/collections/{collectionId}/submissions/{submissionId}/withdraw:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [collections]
      operationId: withdrawCollectionSubmission
      summary: 申請を取り消す（awaiting_review・in_review のとき）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/CollectionSubmission' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/review-queue:
    get:
      tags: [review]
      operationId: listReviewQueue
      summary: 審査待ち（awaiting_review・in_review、古い順。チャンネルと素材集を kind で見分ける）
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 審査待ちの申請
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                        - { $ref: '#/components/schemas/Submission' }
                        - { $ref: '#/components/schemas/CollectionSubmission' }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/package:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [review]
      operationId: getSubmissionPackage
      summary: パッケージ・アイコンの取得先（署名付き URL、5 分）
      responses:
        '200':
          description: 取得先
          content:
            application/json:
              schema:
                type: object
                required: [packageUrl, iconUrl, expiresAt]
                properties:
                  packageUrl: { type: string, format: uri }
                  iconUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/sample-prompts:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [review]
      operationId: getSamplePrompts
      summary: 見本用のプロンプト（プロンプト・パックで組み立てたもの）
      responses:
        '200':
          description: 場面ごとのプロンプト
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SamplePrompts' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/samples:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: saveSamples
      summary: AI に話させた見本を保存（AI の出力だけ。1MB まで）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SamplesInput' }
      responses:
        '201':
          description: 保存した見本
          content:
            application/json:
              schema:
                type: object
                required: [samplesId]
                properties:
                  samplesId: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/reviews:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [review]
      operationId: listReviews
      summary: 審査の記録（見本を含む）
      responses:
        '200':
          description: 審査の記録
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/start:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: startReview
      summary: 審査を始める（awaiting_review → in_review）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/Submission' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/release:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: releaseReview
      summary: 審査を戻す（in_review → awaiting_review）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/Submission' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/approve:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: approveSubmission
      summary: 承認（in_review → approved。リストを作り直す）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveInput' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/return:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: returnSubmission
      summary: 差し戻し（in_review → returned）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingsInput' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/submissions/{submissionId}/reject:
    parameters:
      - { $ref: '#/components/parameters/ChannelId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: rejectSubmission
      summary: 却下（in_review → rejected）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingsInput' }
      responses:
        '200': { $ref: '#/components/responses/Decision' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/channels/{channelId}/revoke:
    parameters: [{ $ref: '#/components/parameters/ChannelId' }]
    post:
      tags: [review]
      operationId: revokeChannel
      summary: 取り下げ（リストから消し、revoked に 7 日載せる）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeInput' }
      responses:
        '200': { $ref: '#/components/responses/Channel' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/package:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [review]
      operationId: getCollectionSubmissionPackage
      summary: 素材集のパッケージの取得先（署名付き URL、5 分）
      responses:
        '200':
          description: 取得先
          content:
            application/json:
              schema:
                type: object
                required: [packageUrl, expiresAt]
                properties:
                  packageUrl: { type: string, format: uri }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/reviews:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    get:
      tags: [review]
      operationId: listCollectionReviews
      summary: 審査の記録
      responses:
        '200':
          description: 審査の記録
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Review' } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/start:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: startCollectionReview
      summary: 審査を始める（awaiting_review → in_review）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/CollectionSubmission' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/release:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: releaseCollectionReview
      summary: 審査を戻す（in_review → awaiting_review）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      responses:
        '200': { $ref: '#/components/responses/CollectionSubmission' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/approve:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: approveCollectionSubmission
      summary: 承認（in_review → approved。身元の記録がなければ verification が必須。C-17）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollectionApproveInput' }
      responses:
        '200': { $ref: '#/components/responses/CollectionDecision' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/return:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: returnCollectionSubmission
      summary: 差し戻し（in_review → returned）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingsInput' }
      responses:
        '200': { $ref: '#/components/responses/CollectionDecision' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/submissions/{submissionId}/reject:
    parameters:
      - { $ref: '#/components/parameters/CollectionId' }
      - { $ref: '#/components/parameters/SubmissionId' }
    post:
      tags: [review]
      operationId: rejectCollectionSubmission
      summary: 却下（in_review → rejected）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FindingsInput' }
      responses:
        '200': { $ref: '#/components/responses/CollectionDecision' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/collections/{collectionId}/revoke:
    parameters: [{ $ref: '#/components/parameters/CollectionId' }]
    post:
      tags: [review]
      operationId: revokeCollection
      summary: 素材集の取り下げ（リストから消し、revokedCollections に 7 日載せる）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeInput' }
      responses:
        '200': { $ref: '#/components/responses/Collection' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers:
    get:
      tags: [admin-publishers]
      operationId: listPublishers
      summary: チャンネル提供者の一覧（新しい順）
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PublisherStatus' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: チャンネル提供者
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Publisher' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    get:
      tags: [admin-publishers]
      operationId: getPublisher
      summary: チャンネル提供者
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/channels:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    get:
      tags: [admin-publishers]
      operationId: listPublisherChannels
      summary: チャンネル提供者のチャンネル
      responses:
        '200': { $ref: '#/components/responses/ChannelList' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/collections:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    get:
      tags: [admin-publishers]
      operationId: listPublisherCollections
      summary: アカウントの素材集
      responses:
        '200': { $ref: '#/components/responses/CollectionList' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/suspend:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    post:
      tags: [admin-publishers]
      operationId: suspendPublisher
      summary: チャンネル提供者を停止（公開中のチャンネルはそのまま）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/resume:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    post:
      tags: [admin-publishers]
      operationId: resumePublisher
      summary: 停止を解く
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/limits:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    put:
      tags: [admin-publishers]
      operationId: setPublisherLimits
      summary: 上限を変える（省いた項目は既定値に戻る）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/LimitsOverride' }
                - type: object
                  required: [reason]
                  properties:
                    reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Publisher' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/key-transfers:
    get:
      tags: [admin-publishers]
      operationId: listKeyTransfers
      summary: 移し替えの申し出（既定は requested、古い順）
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/KeyTransferState' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 申し出
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/KeyTransfer' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/key-transfers/{transferId}/approve:
    parameters:
      - { $ref: '#/components/parameters/PublisherId' }
      - { $ref: '#/components/parameters/TransferId' }
    post:
      tags: [admin-publishers]
      operationId: approveKeyTransfer
      summary: 移し替えを承認（審査待ちの申請は差し戻す。リストを作り直す）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verification]
              properties:
                verification: { $ref: '#/components/schemas/Verification' }
      responses:
        '200': { $ref: '#/components/responses/KeyTransfer' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/key-transfers/{transferId}/reject:
    parameters:
      - { $ref: '#/components/parameters/PublisherId' }
      - { $ref: '#/components/parameters/TransferId' }
    post:
      tags: [admin-publishers]
      operationId: rejectKeyTransfer
      summary: 移し替えを認めない（新しい鍵は外す）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '200': { $ref: '#/components/responses/KeyTransfer' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/signing-keys:
    get:
      tags: [keys]
      operationId: listSigningKeys
      summary: 署名鍵の一覧
      responses:
        '200':
          description: 署名鍵
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SigningKey' } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [keys]
      operationId: registerSigningKey
      summary: KMS の鍵を署名鍵として登録（公開鍵は KMS から取得する）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keyId, kmsKeyArn]
              properties:
                keyId: { type: string, pattern: '^k-[0-9]{4}-[0-9]{2}$' }
                kmsKeyArn: { type: string }
      responses:
        '201':
          description: 署名鍵
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SigningKey' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/keysets:
    get:
      tags: [keys]
      operationId: listKeysets
      summary: 鍵セットの履歴（新しい順）
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 鍵セット
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Keyset' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [keys]
      operationId: registerKeyset
      summary: ルート鍵が署名した鍵セットを登録（リストを作り直す）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { $ref: '#/components/schemas/SignedDocument' }
      responses:
        '201':
          description: 鍵セット
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Keyset' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publications:
    get:
      tags: [publications]
      operationId: listPublications
      summary: 公開の履歴（新しい順）
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: 公開の記録
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Publication' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [publications]
      operationId: republish
      summary: 今すぐ作り直して公開する
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonInput' }
      responses:
        '202': { description: 公開の Lambda を呼んだ }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/audit:
    get:
      tags: [publications]
      operationId: listAudit
      summary: 操作の記録（month と target のどちらか 1 つ）
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        - name: target
          in: query
          description: 例 `CH#kamakura-history`、`PUB#01J…`
          schema: { type: string }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/AuditPage' }
        default: { $ref: '#/components/responses/Error' }

  /api/studio:
    get:
      tags: [studio]
      operationId: getMyStudio
      summary: 自分のスタジオの承認の状態（DES-013 K-14）
      responses:
        '200': { $ref: '#/components/responses/StudioAccount' }
        default: { $ref: '#/components/responses/Error' }

  /api/studio/application:
    post:
      tags: [studio]
      operationId: applyForStudio
      summary: スタジオを出す承認を申し込む（REQ-STUDIO D-14・F-24、スタジオの決まり 1.1・1.2）。素材提供者の役割が要る（ないと role_required）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StudioApplication' } } }
      responses:
        '200': { $ref: '#/components/responses/StudioAccount' }
        default: { $ref: '#/components/responses/Error' }

  /api/studio/studios:
    get:
      tags: [studio]
      operationId: listMyStudios
      summary: 自分のスタジオの一覧（新しい順、50 件まで）
      responses:
        '200': { $ref: '#/components/responses/StudioList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [studio]
      operationId: createStudio
      summary: スタジオを作る（音声があれば、アップロードの先を返す。なければすぐ確認を始める。K-16）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StudioInput' } } }
      responses:
        '201':
          description: 作った
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content: { application/json: { schema: { $ref: '#/components/schemas/StudioCreated' } } }
        default: { $ref: '#/components/responses/Error' }

  /api/studio/studios/{studioId}/{action}:
    parameters:
      - { $ref: '#/components/parameters/StudioId' }
      - name: action
        in: path
        required: true
        description: submit（音声を送り終えて確認を始める。uploading → checking）・stop（載っているスタジオを止める。F-20）・appeal（確認の誤りを運営に申し出る。スタジオの決まり 3。message が要る）
        schema: { type: string, enum: [submit, stop, appeal] }
    post:
      tags: [studio]
      operationId: actOnStudio
      summary: 自分のスタジオを確認に出す・止める・申し出る
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { message: { type: string, minLength: 1, maxLength: 1000 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Studio' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/studio/applications:
    get:
      tags: [admin-studio]
      operationId: listStudioApplications
      summary: 承認の審査待ち（申し込んだ順）
      responses:
        '200':
          description: 審査待ち
          content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/StudioAccount' } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/studio:
    parameters: [{ $ref: '#/components/parameters/PublisherId' }]
    get:
      tags: [admin-studio]
      operationId: getPublisherStudio
      summary: 提供者のスタジオの承認の状態
      responses:
        '200': { $ref: '#/components/responses/StudioAccount' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/publishers/{publisherId}/studio/{decision}:
    parameters:
      - { $ref: '#/components/parameters/PublisherId' }
      - name: decision
        in: path
        required: true
        description: approve（承認）・decline（見送り）・suspend（期間を決めて止める）・resume（止めたのを戻す）・revoke（取り消す）
        schema: { type: string, enum: [approve, decline, suspend, resume, revoke] }
    post:
      tags: [admin-studio]
      operationId: decideStudio
      summary: 提供者の承認を決める（スタジオの決まり 1.4・4.3）。止める・取り消すと載っているスタジオも届けない
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/StudioDecision' } } }
      responses:
        '200': { $ref: '#/components/responses/StudioAccount' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/studio/appeals:
    get:
      tags: [admin-studio]
      operationId: listStudioAppeals
      summary: 素材提供者の申し出（申し出た順）
      responses:
        '200': { $ref: '#/components/responses/StudioList' }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/studio/studios/{studioId}/{decision}:
    parameters:
      - { $ref: '#/components/parameters/StudioId' }
      - name: decision
        in: path
        required: true
        description: 申し出には publish（載せる）・reject（載せない。message が要る）、通報には restore（戻す）・remove（消す。reason が要る）
        schema: { type: string, enum: [publish, reject, restore, remove] }
    post:
      tags: [admin-studio]
      operationId: decideAppeal
      summary: 申し出に答える（スタジオの決まり 3）か、通報されたスタジオを戻す・消す（同 4.3）
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { message: { type: string, maxLength: 1000 }, reason: { type: string, maxLength: 1000 } } } } }
      responses:
        '200': { $ref: '#/components/responses/Studio' }
        default: { $ref: '#/components/responses/Error' }

  /api/studio/studios/{studioId}/stats:
    parameters: [{ $ref: '#/components/parameters/StudioId' }]
    get:
      tags: [studio]
      operationId: getStudioStats
      summary: スタジオの日ごとの聞いた数・開いた数（概数。DES-013 K-18）
      responses:
        '200': { description: 数, content: { application/json: { schema: { $ref: '#/components/schemas/StudioStats' } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/studio/reported:
    get:
      tags: [admin-studio]
      operationId: listReportedStudios
      summary: 通報されたスタジオ（最初の通報の順）
      responses:
        '200': { description: 通報されたスタジオ, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReportedStudio' } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/notes/reported:
    get:
      tags: [admin-notes]
      operationId: listReportedNotes
      summary: 通報された一言（最初の通報の順）。置いた端末は出さない
      responses:
        '200': { description: 通報された一言, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ReportedNote' } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/notes/{noteId}/{decision}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Ulid' }
      - name: decision
        in: path
        required: true
        description: restore（隠したのを戻す）・remove（消す。本文も消す。reason が要る。ban で置いた端末を締め出せる）
        schema: { type: string, enum: [restore, remove] }
    post:
      tags: [admin-notes]
      operationId: decideReportedNote
      summary: 通報された一言に答える（一言の利用規約 3）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1000 }
                ban: { type: object, description: 置いた端末を締め出す。days がなければ期限なし, properties: { days: { type: integer, minimum: 1, maximum: 365 } } }
      responses:
        '200':
          description: 答えた
          content: { application/json: { schema: { type: object, required: [noteId, state], properties: { noteId: { type: string }, state: { type: string }, ban: { type: object, properties: { until: { type: string, format: date-time } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/notes/bans:
    get:
      tags: [admin-notes]
      operationId: listBans
      summary: 締め出し（もとの一言で示す。端末は出さない）
      responses:
        '200': { description: 締め出し, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Ban' } } } } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/notes/bans/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Ulid' }
    delete:
      tags: [admin-notes]
      operationId: liftBan
      summary: 締め出しを解く
      responses:
        '204': { description: 解いた }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/local/areas:
    get:
      tags: [admin-local]
      operationId: listClosedAreas
      summary: 一言・スタジオを置けない区画（REQ-STUDIO・REQ-NOTES F-15）
      responses:
        '200': { description: 置けない区画, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/ClosedArea' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [admin-local]
      operationId: closeArea
      summary: 区画を置けないようにする（アプリには 5 分以内に効く）
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [cell, reason], properties: { cell: { type: string, pattern: '^[0-9b-hjkmnp-z]{5,7}$' }, reason: { type: string, minLength: 1, maxLength: 500 } } } } }
      responses:
        '201': { description: 置けなくした, content: { application/json: { schema: { $ref: '#/components/schemas/ClosedArea' } } } }
        default: { $ref: '#/components/responses/Error' }

  /api/admin/local/areas/{cell}:
    parameters:
      - name: cell
        in: path
        required: true
        schema: { type: string, pattern: '^[0-9b-hjkmnp-z]{5,7}$' }
    delete:
      tags: [admin-local]
      operationId: openArea
      summary: 置けない区画を外す
      responses:
        '204': { description: 外した }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito のアクセストークン。`cognito:groups` に `publisher` / `operator`

  headers:
    ETag:
      description: '`"{rev}"`。変える操作の `If-Match` に送る'
      schema: { type: string }

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 取得したときの `ETag`。ないと 428、違うと 412
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ChannelId' }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/CollectionId' }
    PublisherId:
      name: publisherId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }
    StudioId:
      name: studioId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Ulid' }

  responses:
    StudioAccount:
      description: スタジオの承認
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/StudioAccount' } } }
    Studio:
      description: スタジオ
      headers: { ETag: { $ref: '#/components/headers/ETag' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Studio' } } }
    StudioList:
      description: スタジオの一覧
      content: { application/json: { schema: { $ref: '#/components/schemas/StudioList' } } }
    Error:
      description: エラー（RFC 9457）
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Publisher:
      description: チャンネル提供者
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Publisher' }
    Channel:
      description: チャンネル
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Channel' }
    ChannelList:
      description: チャンネルの一覧
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Channel' } }
    Submission:
      description: 申請
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Submission' }
    Decision:
      description: 判定後の申請と公開の状況
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema:
            type: object
            required: [submission, publication]
            properties:
              submission: { $ref: '#/components/schemas/Submission' }
              publication:
                type: string
                enum: [pending, none]
                description: approve は pending（公開の Lambda を呼んだ）、return・reject は none
    Collection:
      description: 素材集
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Collection' }
    CollectionList:
      description: 素材集の一覧
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Collection' } }
    CollectionSubmission:
      description: 素材集の申請
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CollectionSubmission' }
    CollectionDecision:
      description: 判定後の素材集の申請と公開の状況
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema:
            type: object
            required: [submission, publication]
            properties:
              submission: { $ref: '#/components/schemas/CollectionSubmission' }
              publication: { type: string, enum: [pending, none] }
    KeyTransfer:
      description: 鍵の移し替え
      headers:
        ETag: { $ref: '#/components/headers/ETag' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/KeyTransfer' }
    AuditPage:
      description: 操作の記録（新しい順）
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
              nextCursor: { type: [string, 'null'] }

  schemas:
    Ulid:
      type: string
      pattern: '^[0-9A-HJKMNP-TV-Z]{26}$'
    ChannelId:
      type: string
      pattern: '^[a-z0-9-]{3,40}$'
    CollectionId:
      type: string
      pattern: '^[a-z0-9-]{3,40}$'
      description: 素材集 ID（チャンネルの ID とは別の名前空間。1.1）
    AccountId:
      type: string
      pattern: '^sg1[a-z2-7]{32}$'
    Base64Url:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
    Rev:
      type: integer
      minimum: 1

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, default: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: 問い合わせ用の要求 ID }
        code:
          type: string
          enum:
            - invalid_request
            - invalid_signature
            - challenge_invalid
            - keyset_invalid
            - unauthorized
            - forbidden
            - publisher_not_active
            - role_required
            - not_found
            - already_registered
            - channel_id_taken
            - collection_id_taken
            - producer_not_verified
            - resource_in_use
            - account_id_taken
            - key_already_bound
            - transfer_pending
            - limit_reached
            - pending_submission_exists
            - invalid_state
            - version_not_newer
            - precondition_failed
            - precondition_required
            - payload_too_large
            - quota_exceeded
            - throttled
            - studio_not_approved
            - internal
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string, description: JSON Pointer }
              message: { type: string }

    StudioStatus:
      type: string
      description: none（申し込んでいない）・requested（審査待ち）・approved・declined（見送り）・suspended（期間を決めて止めた）・revoked（取り消した）
      enum: [none, requested, approved, declined, suspended, revoked]

    StudioAccount:
      type: object
      required: [publisherId, status, rev]
      properties:
        publisherId: { $ref: '#/components/schemas/Ulid' }
        status: { $ref: '#/components/schemas/StudioStatus' }
        displayName: { type: string, description: スタジオの読み上げに使う名前 }
        description: { type: string }
        plans: { type: string }
        agreedVersion: { type: integer, description: 同意したスタジオの決まりの版 }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        reason: { type: string, description: 見送り・止めた・取り消した理由 }
        checks: { $ref: '#/components/schemas/StudioChecks' }
        suspendedUntil: { type: string, format: date-time }
        reapplyAfter: { type: string, format: date-time, description: 取り消したあと、申し込み直せる時刻 }
        rev: { type: integer, description: 申し込む前は 0 }

    StudioApplication:
      type: object
      required: [displayName, description, plans, agreedVersion]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, minLength: 1, maxLength: 1000, description: どんな団体・人か、どこで活動しているか、本人確認の手がかり }
        plans: { type: string, minLength: 1, maxLength: 1000, description: どんなお知らせを、どの辺りで、どれくらいの頻度で }
        agreedVersion: { type: integer, minimum: 1 }

    StudioChecks:
      type: object
      description: スタジオの決まり 1.3 の 4 項目。承認にはすべて true が要る
      required: [identity, name, content, history]
      properties:
        identity: { type: boolean }
        name: { type: boolean }
        content: { type: boolean }
        history: { type: boolean }

    StudioDecision:
      type: object
      properties:
        checks: { $ref: '#/components/schemas/StudioChecks' }
        reason: { type: string, minLength: 1, maxLength: 1000, description: decline・suspend・revoke に要る }
        until: { type: string, format: date-time, description: suspend に要る（1〜3 か月先） }
        message: { type: string, maxLength: 1000 }

    StudioState:
      type: string
      description: uploading（音声待ち）・checking（確認中）・returned（返した）・appealed（申し出中）・live（載っている）・stopped（素材提供者が止めた）・suspended（通報や承認を止めたことで止まった）・removed（運営が消した）・rejected（申し出を受けて載せないと決めた）
      enum: [uploading, checking, returned, appealed, live, stopped, suspended, removed, rejected]

    StudioCategory:
      type: string
      description: スタジオの分類（platform API-MATERIALS「スタジオの分類」、ADR-MATERIALS D-55）
      enum: [shrine-temple, event, food, shopping, sightseeing, nature, culture, traffic, community]

    StudioInput:
      type: object
      required: [category, text, cells, startsAt, endsAt]
      properties:
        category: { $ref: '#/components/schemas/StudioCategory' }
        text: { type: string, minLength: 1, maxLength: 200 }
        cells: { type: array, minItems: 1, maxItems: 9, uniqueItems: true, items: { type: string, pattern: '^[0-9b-hjkmnp-z]{6}$' } }
        startsAt: { type: string, format: date-time, description: 今から 30 日以内 }
        endsAt: { type: string, format: date-time, description: startsAt から 1 日〜30 日 }
        hours: { $ref: '#/components/schemas/StudioHours' }
        audio: { type: object, required: [bytes], properties: { bytes: { type: integer, minimum: 1, maximum: 524288 } } }

    StudioHours:
      type: object
      required: [from, to]
      properties:
        from: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        to: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    Studio:
      type: object
      required: [studioId, publisherId, providerName, category, text, cells, startsAt, endsAt, state, rev, createdAt, updatedAt]
      properties:
        studioId: { $ref: '#/components/schemas/Ulid' }
        publisherId: { $ref: '#/components/schemas/Ulid' }
        providerName: { type: string }
        category: { $ref: '#/components/schemas/StudioCategory' }
        text: { type: string }
        cells: { type: array, items: { type: string } }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        hours: { $ref: '#/components/schemas/StudioHours' }
        audio: { type: object, properties: { durationSec: { type: number }, bytes: { type: integer } } }
        state: { $ref: '#/components/schemas/StudioState' }
        check:
          type: object
          description: 自動の確認の結果。items は当たったスタジオの決まりの項目（2.2.x）か、audio_missing・audio_format・audio_length・transcribe_failed・check_unavailable・unclear
          required: [items]
          properties:
            items: { type: array, items: { type: string } }
            transcript: { type: string, description: 音声を文字に起こしたもの }
            checkedAt: { type: string, format: date-time }
        appeal: { type: object, required: [message, at], properties: { message: { type: string }, at: { type: string, format: date-time } } }
        decision: { type: object, required: [at], properties: { message: { type: string }, at: { type: string, format: date-time } } }
        rev: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudioList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Studio' } }

    StudioCreated:
      type: object
      required: [studio]
      properties:
        studio: { $ref: '#/components/schemas/Studio' }
        upload:
          type: object
          description: 音声があるとき。S3 への POST（15 分）。送り終えたら submit を呼ぶ
          required: [url, fields, maxBytes]
          properties:
            url: { type: string }
            fields: { type: object, additionalProperties: { type: string } }
            maxBytes: { type: integer }

    Approx:
      type: [object, 'null']
      description: 概数。3 未満は null、3 以上は 3・10・30・100・300・1,000 の区切りの下限（API-LOCAL-MATERIALS「概数」）
      required: [atLeast]
      properties:
        atLeast: { type: integer }

    StudioStats:
      type: object
      required: [studioId, total, days]
      properties:
        studioId: { $ref: '#/components/schemas/Ulid' }
        total: { type: object, required: [heard, opened], properties: { heard: { $ref: '#/components/schemas/Approx' }, opened: { $ref: '#/components/schemas/Approx' } } }
        days:
          type: array
          items: { type: object, required: [date, heard, opened], properties: { date: { type: string, description: 日本時間の日付 }, heard: { $ref: '#/components/schemas/Approx' }, opened: { $ref: '#/components/schemas/Approx' } } }

    ReportedStudio:
      type: object
      required: [studio, reports, firstAt, lastAt, reasons]
      properties:
        studio: { $ref: '#/components/schemas/Studio' }
        reports: { type: integer, description: 通報した端末の数 }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        reasons: { type: array, items: { type: string }, description: danger・harassment・ad・rights・inappropriate・other }

    ReportedNote:
      type: object
      required: [noteId, cell, state, expiresAt, createdAt, reports, firstAt, lastAt, reasons]
      properties:
        noteId: { $ref: '#/components/schemas/Ulid' }
        text: { type: string, description: 消した一言にはない }
        cell: { type: string }
        spotName: { type: string }
        state: { type: string, description: active・hidden（3 台の通報で隠した）・removed・deleted }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        reports: { type: integer }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        reasons: { type: array, items: { type: string } }

    Ban:
      type: object
      required: [noteId, reason, createdAt]
      properties:
        noteId: { $ref: '#/components/schemas/Ulid' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        until: { type: string, format: date-time, description: ないときは期限なし }

    ClosedArea:
      type: object
      required: [cell, reason, createdAt]
      properties:
        cell: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }

    Me:
      type: object
      required: [sub, roles]
      properties:
        sub: { type: string }
        roles:
          type: array
          items: { type: string, enum: [publisher, operator] }
        publisher:
          oneOf:
            - { $ref: '#/components/schemas/Publisher' }
            - { type: 'null' }

    PublisherStatus:
      type: string
      enum: [pending_key, active, suspended, deleted]
    PublisherInput:
      type: object
      required: [displayName, contact]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        contact: { type: string, minLength: 1, maxLength: 200, description: 審査・移し替えの連絡先 }
    PublisherPatch:
      type: object
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
        contact: { type: string, minLength: 1, maxLength: 200 }
    Limits:
      type: object
      required: [channels, uploadsPerDay, ticketsPerDay]
      properties:
        channels: { type: integer, minimum: 0, default: 5 }
        collections: { type: integer, minimum: 0, default: 5, description: 1.1 }
        uploadsPerDay: { type: integer, minimum: 0, default: 20 }
        ticketsPerDay: { type: integer, minimum: 0, default: 10 }
    LimitsOverride:
      type: object
      properties:
        channels: { type: integer, minimum: 0 }
        collections: { type: integer, minimum: 0 }
        uploadsPerDay: { type: integer, minimum: 0 }
        ticketsPerDay: { type: integer, minimum: 0 }
    Usage:
      type: object
      required: [channels, uploadsToday, ticketsToday]
      properties:
        channels: { type: integer }
        collections: { type: integer, description: 1.1 }
        uploadsToday: { type: integer, description: チャンネルと素材集の申請を合わせた数（M-19） }
        ticketsToday: { type: integer }
    Publisher:
      type: object
      required: [publisherId, displayName, status, limits, usage, rev, createdAt, updatedAt]
      properties:
        publisherId: { $ref: '#/components/schemas/Ulid' }
        displayName: { type: string }
        contact: { type: string, description: 本人と運営だけに返す }
        status: { $ref: '#/components/schemas/PublisherStatus' }
        statusReason: { type: string }
        activeAccountId:
          oneOf:
            - { $ref: '#/components/schemas/AccountId' }
            - { type: 'null' }
        roles:
          type: array
          items: { type: string, enum: [publisher, producer] }
          description: アカウントの役割（M-16）
        producerVerified: { type: boolean, description: 素材提供者の身元が確かめられているか（C-17） }
        producerVerification:
          allOf: [{ $ref: '#/components/schemas/Verification' }]
          description: 身元の確認の記録（運営にだけ返す）
        limits: { $ref: '#/components/schemas/Limits' }
        usage: { $ref: '#/components/schemas/Usage' }
        rev: { $ref: '#/components/schemas/Rev' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    KeyChallenge:
      type: object
      required: [nonce, message, expiresAt]
      properties:
        nonce: { $ref: '#/components/schemas/Ulid' }
        message: { type: string, description: 'これの UTF-8 に Ed25519 で署名する' }
        expiresAt: { type: string, format: date-time }
    KeyProof:
      type: object
      required: [nonce, publicKey, signature]
      properties:
        nonce: { $ref: '#/components/schemas/Ulid' }
        publicKey: { $ref: '#/components/schemas/Base64Url' }
        signature: { $ref: '#/components/schemas/Base64Url' }
    PublisherKey:
      type: object
      required: [accountId, publicKey, status, boundAt]
      properties:
        accountId: { $ref: '#/components/schemas/AccountId' }
        publicKey: { $ref: '#/components/schemas/Base64Url' }
        status: { type: string, enum: [active, pending_transfer, unbound] }
        boundAt: { type: string, format: date-time }
        unboundAt: { type: string, format: date-time }
        unboundReason: { type: string }

    KeyTransferState:
      type: string
      enum: [requested, approved, rejected, cancelled]
    KeyTransferInput:
      allOf:
        - { $ref: '#/components/schemas/KeyProof' }
        - type: object
          required: [reason, publicReason]
          properties:
            reason: { type: string, enum: [lost, leaked, other] }
            publicReason: { type: string, minLength: 1, maxLength: 60 }
            note: { type: string, maxLength: 2000 }
    Verification:
      type: object
      required: [method, detail]
      properties:
        method: { type: string, minLength: 1, maxLength: 100, description: 例 登録済みの連絡先への返信 }
        detail: { type: string, minLength: 1, maxLength: 2000 }
    KeyTransfer:
      type: object
      required: [transferId, publisherId, fromAccountId, toAccountId, reason, publicReason, state, rev, requestedAt]
      properties:
        transferId: { $ref: '#/components/schemas/Ulid' }
        publisherId: { $ref: '#/components/schemas/Ulid' }
        fromAccountId: { $ref: '#/components/schemas/AccountId' }
        toAccountId: { $ref: '#/components/schemas/AccountId' }
        reason: { type: string, enum: [lost, leaked, other] }
        publicReason: { type: string }
        note: { type: string }
        state: { $ref: '#/components/schemas/KeyTransferState' }
        verification: { $ref: '#/components/schemas/Verification' }
        decisionReason: { type: string }
        returnedSubmissions:
          type: array
          items: { $ref: '#/components/schemas/Ulid' }
        rev: { $ref: '#/components/schemas/Rev' }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }

    ListedPackage:
      type: object
      required: [url, sha256, size, format]
      properties:
        url: { type: string, format: uri }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        size: { type: integer }
        format: { type: integer }
    LatestApproved:
      type: object
      description: リストの channels[] の 1 件になる内容（DM-001 M-8）
      required: [submissionId, version, publisher, name, summary, lang, icon, package, activities, genres, requires, minAppVersions, approvedAt]
      properties:
        submissionId: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer, minimum: 1 }
        publisher: { $ref: '#/components/schemas/AccountId' }
        name: { type: string }
        summary: { type: string }
        description: { type: string }
        lang: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        icon:
          type: object
          required: [url, sha256]
          properties:
            url: { type: string, format: uri }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        package: { $ref: '#/components/schemas/ListedPackage' }
        minAppVersions: { $ref: '#/components/schemas/MinAppVersions' }
        activities: { type: array, items: { type: string }, description: DES-011 N-3。パッケージの activities }
        genres: { type: array, items: { type: string } }
        requires: { type: array, items: { type: string }, description: パッケージの requires.features }
        approvedAt: { type: string, format: date-time }
    MinAppVersions:
      type: object
      description: DES-011 N-5。アプリの ID → 必要な versionCode（platform API-CHANNEL-LIST P-20）
      additionalProperties: { type: integer }
    OfferedIn:
      type: array
      description: DES-011 N-9。このチャンネルが出るアプリの名前（過ごし方と必要な機能から）。空ならどのアプリにも出ない
      items: { type: string }
    Channel:
      type: object
      required: [channelId, publisherId, status, rev, createdAt, updatedAt]
      properties:
        channelId: { $ref: '#/components/schemas/ChannelId' }
        publisherId: { $ref: '#/components/schemas/Ulid' }
        status: { type: string, enum: [active, revoked] }
        pendingSubmissionId:
          oneOf:
            - { $ref: '#/components/schemas/Ulid' }
            - { type: 'null' }
        latestApproved:
          oneOf:
            - { $ref: '#/components/schemas/LatestApproved' }
            - { type: 'null' }
        listed: { type: boolean, description: 今のリストに載っているか }
        offeredIn: { $ref: '#/components/schemas/OfferedIn' }
        publisherChange:
          type: [object, 'null']
          properties:
            from: { $ref: '#/components/schemas/AccountId' }
            at: { type: string, format: date-time }
            reason: { type: string }
            until: { type: string, format: date-time }
        revocations:
          type: array
          items:
            type: object
            required: [reason, severity, revokedAt]
            properties:
              versions: { type: array, items: { type: integer } }
              reason: { type: string }
              severity: { type: string, enum: [high, low] }
              revokedAt: { type: string, format: date-time }
        rev: { $ref: '#/components/schemas/Rev' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubmissionState:
      type: string
      enum: [uploading, validating, validation_failed, awaiting_review, in_review, approved, returned, rejected, withdrawn, expired, superseded, revoked]
    SubmissionInput:
      type: object
      properties:
        description: { type: string, maxLength: 1000 }
        tags:
          type: array
          maxItems: 8
          items: { type: string, pattern: '^[a-z0-9-]{1,20}$' }
        regions:
          type: array
          maxItems: 8
          items: { type: string, pattern: '^[0-9b-hjkmnp-z]{1,8}$', description: geohash の接頭辞 }
        note: { type: string, maxLength: 2000, description: 運営への説明 }
    Validation:
      type: object
      required: [ok, errors, checkedAt, validatorVersion]
      properties:
        ok: { type: boolean }
        errors:
          type: array
          maxItems: 100
          items:
            type: object
            required: [code, detail]
            properties:
              code: { type: string, description: API-CHANNEL-PACKAGE のエラーコード、または bad_icon・id_mismatch・publisher_mismatch・version_not_newer }
              detail: { type: string }
        appStage: { type: integer, description: 必要なアプリの段（API-CHANNEL-PACKAGE 確認の手順 10。1.1 からは使う素材集の中身も数える） }
        collections:
          type: array
          description: （チャンネル）宣言した素材集ごとの解決の結果（C-19）
          items:
            type: object
            required: [as, collectionId, status]
            properties:
              as: { type: string }
              collectionId: { $ref: '#/components/schemas/CollectionId' }
              status: { type: string, enum: [usable, unusable] }
              code: { type: string, description: collection_not_listed・not_granted・bad_manifest など }
              detail: { type: string }
        external:
          type: array
          description: （素材集）外部の素材ごとの確認（M-20）
          items:
            type: object
            required: [resourceId, ok]
            properties:
              resourceId: { type: string }
              ok: { type: boolean }
              detail: { type: string }
        inUse:
          type: array
          description: （素材集）公開中のチャンネルが参照している素材を消した・種類を変えた（D-8・M-22）
          items:
            type: object
            required: [channelId, resourceId, detail]
            properties:
              channelId: { $ref: '#/components/schemas/ChannelId' }
              resourceId: { type: string }
              detail: { type: string }
        warnings:
          type: array
          description: 拒まないが知らせること（例 grants_narrowed）
          items:
            type: object
            required: [code, detail]
            properties:
              code: { type: string }
              detail: { type: string }
        checkedAt: { type: string, format: date-time }
        validatorVersion: { type: string }
    Finding:
      type: object
      required: [item, detail]
      properties:
        item: { type: string, pattern: '^[0-9]+(\.[0-9]+)*$', description: 審査基準の項目番号（例 2.2） }
        detail: { type: string, minLength: 1, maxLength: 2000 }
    Decision:
      type: object
      required: [action, at]
      properties:
        action: { type: string, enum: [approve, return, reject] }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        message: { type: string }
        at: { type: string, format: date-time }
    Submission:
      type: object
      required: [submissionId, channelId, accountId, state, rev, createdAt, updatedAt]
      properties:
        kind: { type: string, enum: [channel], description: 1.1。審査待ちの一覧で素材集の申請と見分ける }
        submissionId: { $ref: '#/components/schemas/Ulid' }
        channelId: { $ref: '#/components/schemas/ChannelId' }
        version: { type: [integer, 'null'], description: パッケージの channel.json から（機械審査の後） }
        accountId: { $ref: '#/components/schemas/AccountId' }
        state: { $ref: '#/components/schemas/SubmissionState' }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        activities: { type: array, items: { type: string }, description: DES-011 N-3。パッケージの activities }
        genres: { type: array, items: { type: string } }
        requires: { type: array, items: { type: string }, description: パッケージの requires.features }
        offeredIn: { $ref: '#/components/schemas/OfferedIn' }
        note: { type: string }
        sha256: { type: [string, 'null'] }
        size: { type: [integer, 'null'] }
        validation:
          oneOf:
            - { $ref: '#/components/schemas/Validation' }
            - { type: 'null' }
        decision:
          oneOf:
            - { $ref: '#/components/schemas/Decision' }
            - { type: 'null' }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        rev: { $ref: '#/components/schemas/Rev' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PresignedPost:
      type: object
      required: [url, fields, maxBytes]
      properties:
        url: { type: string, format: uri }
        fields:
          type: object
          additionalProperties: { type: string }
        maxBytes: { type: integer }
    SubmissionCreated:
      type: object
      required: [submission, uploads, uploadExpiresAt]
      properties:
        submission: { $ref: '#/components/schemas/Submission' }
        uploads:
          type: object
          required: [package, icon]
          properties:
            package: { $ref: '#/components/schemas/PresignedPost' }
            icon: { $ref: '#/components/schemas/PresignedPost' }
        uploadExpiresAt: { type: string, format: date-time }

    Collection:
      type: object
      required: [collectionId, publisherId, status, rev, createdAt, updatedAt]
      properties:
        collectionId: { $ref: '#/components/schemas/CollectionId' }
        publisherId: { $ref: '#/components/schemas/Ulid' }
        status: { type: string, enum: [active, revoked] }
        pendingSubmissionId:
          oneOf:
            - { $ref: '#/components/schemas/Ulid' }
            - { type: 'null' }
        latestApproved:
          oneOf:
            - { $ref: '#/components/schemas/CollectionLatestApproved' }
            - { type: 'null' }
        listed: { type: boolean, description: 今のリストに載っているか }
        producerChange:
          type: [object, 'null']
          properties:
            from: { $ref: '#/components/schemas/AccountId' }
            at: { type: string, format: date-time }
            reason: { type: string }
            until: { type: string, format: date-time }
        externalCheck:
          type: [object, 'null']
          description: 毎日の外部の素材の確認（M-21）
          properties:
            checkedAt: { type: string, format: date-time }
            failures:
              type: array
              items:
                type: object
                properties:
                  resourceId: { type: string }
                  url: { type: string }
                  status: { type: string }
        revocations:
          type: array
          items:
            type: object
            required: [reason, severity, revokedAt]
            properties:
              versions: { type: array, items: { type: integer } }
              reason: { type: string }
              severity: { type: string, enum: [high, low] }
              revokedAt: { type: string, format: date-time }
        rev: { $ref: '#/components/schemas/Rev' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectionLatestApproved:
      type: object
      description: リストの collections[] の 1 件になる内容（DM-001 M-24）
      required: [submissionId, version, producer, name, summary, media, resourcesSize, tags, grants, package, minAppVersions, approvedAt]
      properties:
        submissionId: { $ref: '#/components/schemas/Ulid' }
        version: { type: integer, minimum: 1 }
        producer: { $ref: '#/components/schemas/AccountId' }
        name: { type: string }
        summary: { type: string }
        media: { type: array, items: { type: string, enum: [text, image, audio, video] } }
        resourcesSize: { type: integer }
        tags: { type: array, items: { type: string } }
        regions: { type: array, items: { type: string } }
        grants:
          type: object
          required: [publishers]
          properties:
            publishers:
              oneOf:
                - { type: string, const: '*' }
                - { type: array, items: { $ref: '#/components/schemas/AccountId' } }
            apps: { type: array, items: { type: string }, description: DES-011 N-7。使ってよいアプリの ID（ないときはすべてのアプリ） }
            grounding: { type: boolean, description: platform API-MATERIALS I-13。AI の根拠に使ってよいとき真（偽は書かない） }
        package: { $ref: '#/components/schemas/ListedPackage' }
        appStage: { type: integer }
        minAppVersions: { $ref: '#/components/schemas/MinAppVersions' }
        approvedAt: { type: string, format: date-time }
    CollectionSubmission:
      type: object
      required: [kind, submissionId, collectionId, accountId, state, rev, createdAt, updatedAt]
      properties:
        kind: { type: string, enum: [collection] }
        submissionId: { $ref: '#/components/schemas/Ulid' }
        collectionId: { $ref: '#/components/schemas/CollectionId' }
        version: { type: [integer, 'null'], description: パッケージの collection.json から（機械審査の後） }
        accountId: { $ref: '#/components/schemas/AccountId' }
        state: { $ref: '#/components/schemas/SubmissionState' }
        note: { type: string }
        sha256: { type: [string, 'null'] }
        size: { type: [integer, 'null'] }
        validation:
          oneOf:
            - { $ref: '#/components/schemas/Validation' }
            - { type: 'null' }
        decision:
          oneOf:
            - { $ref: '#/components/schemas/Decision' }
            - { type: 'null' }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        rev: { $ref: '#/components/schemas/Rev' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CollectionSubmissionCreated:
      type: object
      required: [submission, uploads, uploadExpiresAt]
      properties:
        submission: { $ref: '#/components/schemas/CollectionSubmission' }
        uploads:
          type: object
          required: [package]
          properties:
            package: { $ref: '#/components/schemas/PresignedPost' }
        uploadExpiresAt: { type: string, format: date-time }
    CollectionApproveInput:
      type: object
      properties:
        message: { type: string, maxLength: 2000 }
        verification:
          allOf: [{ $ref: '#/components/schemas/Verification' }]
          description: アカウントに身元の記録がないときは必須（C-17）
    UsedBy:
      type: object
      required: [channelId, channelVersion, publisherName, resources]
      properties:
        channelId: { $ref: '#/components/schemas/ChannelId' }
        channelName: { type: string }
        channelVersion: { type: integer }
        publisherName: { type: string }
        resources:
          type: array
          description: 参照している素材の ID（題材で選ぶだけのときは空）
          items: { type: string }

    SignedDocument:
      type: object
      required: [payload, keyId, sig]
      properties:
        payload: { $ref: '#/components/schemas/Base64Url' }
        keyId: { type: string }
        sig: { $ref: '#/components/schemas/Base64Url' }
    TestTicket:
      type: object
      required: [submissionId, document, qr, issuedAt, expiresAt]
      properties:
        submissionId: { $ref: '#/components/schemas/Ulid' }
        document: { $ref: '#/components/schemas/SignedDocument' }
        qr: { type: string, description: QR コードにする文字列（API-CHANNEL-LIST の試用チケット） }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    SamplePrompts:
      type: object
      required: [generatedBy, scenarios]
      properties:
        generatedBy: { type: string, description: 組み立てた core-format とプロンプト・パックの版 }
        noRepresentativeApp:
          type: array
          items: { type: string }
          description: DES-011 N-8。代表のアプリがまだない過ごし方（このときは scenarios が空。語り手の文章を読んで確かめる）
        scenarios:
          type: array
          items:
            type: object
            required: [id, label, system, user]
            properties:
              id: { type: string }
              label: { type: string }
              system: { type: string }
              user: { type: string }
    SamplesInput:
      type: object
      required: [service, model, items]
      properties:
        service: { type: string, minLength: 1, maxLength: 40 }
        model: { type: string, minLength: 1, maxLength: 100 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [scenarioId, output]
            properties:
              scenarioId: { type: string }
              output: { type: string, maxLength: 20000 }
    Review:
      type: object
      required: [reviewerSub, action, at]
      properties:
        reviewerSub: { type: string }
        action: { type: string, enum: [start, release, approve, return, reject] }
        findings: { type: array, items: { $ref: '#/components/schemas/Finding' } }
        message: { type: string }
        samples:
          type: array
          items:
            type: object
            required: [samplesId, service, model]
            properties:
              samplesId: { type: string }
              service: { type: string }
              model: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    scenarioId: { type: string }
                    output: { type: string }
        at: { type: string, format: date-time }
    ApproveInput:
      type: object
      properties:
        samplesIds: { type: array, items: { type: string } }
        message: { type: string, maxLength: 2000 }
    FindingsInput:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Finding' }
        message: { type: string, maxLength: 2000 }
        samplesIds: { type: array, items: { type: string } }
    RevokeInput:
      type: object
      required: [reason, severity]
      properties:
        versions:
          type: array
          items: { type: integer, minimum: 1 }
          description: 省くとすべての版
        reason: { type: string, minLength: 1, maxLength: 200, description: 散策者に見せる理由 }
        severity: { type: string, enum: [high, low] }
    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    SigningKey:
      type: object
      required: [keyId, kmsKeyArn, publicKey, status]
      properties:
        keyId: { type: string }
        kmsKeyArn: { type: string }
        publicKey: { $ref: '#/components/schemas/Base64Url' }
        notBefore: { type: [string, 'null'], format: date-time, description: 鍵セットに載ってから決まる }
        notAfter: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [registered, active, retiring, revoked] }
    Keyset:
      type: object
      required: [seq, document, registeredAt]
      properties:
        seq: { type: integer }
        document: { $ref: '#/components/schemas/SignedDocument' }
        keyIds: { type: array, items: { type: string } }
        revokedKeyIds: { type: array, items: { type: string } }
        registeredAt: { type: string, format: date-time }
    Publication:
      type: object
      required: [seq, issuedAt, expiresAt, sha256, size, keyId, trigger, channelCount, revokedCount]
      properties:
        seq: { type: integer }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        sha256: { type: string }
        size: { type: integer }
        keyId: { type: string }
        trigger: { type: string, enum: [approve, revoke, transfer, keyset, daily, manual] }
        channelCount: { type: integer }
        revokedCount: { type: integer }
        collectionCount: { type: integer, description: 1.1 }
        revokedCollectionCount: { type: integer, description: 1.1 }

    AuditEvent:
      type: object
      required: [eventId, at, actorRole, action, target]
      properties:
        eventId: { $ref: '#/components/schemas/Ulid' }
        at: { type: string, format: date-time }
        actorSub: { type: string, description: 運営にだけ返す }
        actorRole: { type: string, enum: [publisher, operator, system] }
        action: { type: string }
        target: { type: string }
        reason: { type: string }
        detail: { type: object }
