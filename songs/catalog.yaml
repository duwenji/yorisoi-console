# The season's songs (platform API-SONGS). make_songs.py reads this with songs/scores/{id}.ly.
#
# rights: the lyricist and the composer with the year each died (null when not known: a 文部省唱歌),
# the first songbook, where the notes were taken from, and who checked it all and when (D-14).
# tempo (quarter notes a minute), when given, replaces the score's own: some have none.
# A song is made only when checkedAt and checkedBy are filled in: fill them in after listening to it
# against the first songbook and confirming the people and the years.

credit: "演奏: yorisoi 運営（CC BY-SA 4.0）。楽譜: Wikipedia 日本語版（CC BY-SA 4.0）・広島大学図書館（パブリックドメイン）。曲はパブリックドメインです。"

